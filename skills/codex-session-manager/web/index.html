<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Sessions</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #101214; color: #eef1f4; }
    main { max-width: 1080px; margin: 0 auto; padding: 32px 20px 60px; }
    header { display: flex; gap: 20px; align-items: end; justify-content: space-between; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 28px; }
    .muted { color: #9da7b1; }
    input { width: min(360px, 80vw); padding: 10px 12px; border: 1px solid #3a4148; border-radius: 8px; background: #181c20; color: inherit; }
    #status { min-height: 24px; margin: 18px 0 8px; }
    .grid { display: grid; gap: 12px; }
    article { border: 1px solid #30363d; border-radius: 10px; padding: 16px; background: #171a1e; }
    .row { display: flex; gap: 12px; justify-content: space-between; align-items: start; flex-wrap: wrap; }
    h2 { font-size: 17px; margin: 0 0 10px; overflow-wrap: anywhere; }
    dl { display: grid; grid-template-columns: 88px 1fr; gap: 5px 10px; margin: 0; font-size: 14px; }
    dt { color: #9da7b1; }
    dd { margin: 0; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid #4a535c; border-radius: 7px; padding: 7px 11px; background: #242a30; color: inherit; cursor: pointer; }
    button:hover { background: #303841; }
    button.danger { border-color: #8d4040; color: #ffb5b5; }
    button:disabled { opacity: .55; cursor: wait; }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>Codex Sessions</h1><div class="muted">Local session manager</div></div>
    <input id="filter" type="search" placeholder="Filter title, cwd, state, or ID" autocomplete="off">
  </header>
  <div id="status" class="muted">Loading…</div>
  <section id="sessions" class="grid" aria-live="polite"></section>
</main>
<script>
  const list = document.querySelector('#sessions');
  const status = document.querySelector('#status');
  const filter = document.querySelector('#filter');
  let sessions = [];

  function el(name, text, className) {
    const node = document.createElement(name);
    if (text !== undefined) node.textContent = text;
    if (className) node.className = className;
    return node;
  }
  function formatTime(value) {
    const date = new Date(value);
    return Number.isNaN(date.valueOf()) ? value : date.toLocaleString();
  }
  function field(dl, name, value) {
    dl.append(el('dt', name), el('dd', value || '—'));
  }
  function render() {
    const query = filter.value.trim().toLowerCase();
    const shown = sessions.filter(session => [
      session.title, session.cwd, session.id, session.archived ? 'archived' : 'active'
    ].join(' ').toLowerCase().includes(query));
    list.replaceChildren();
    for (const session of shown) {
      const card = el('article');
      const row = el('div', undefined, 'row');
      const info = el('div');
      const dl = el('dl');
      field(dl, 'cwd', session.cwd);
      field(dl, 'updated', formatTime(session.updated_at));
      field(dl, 'state', session.archived ? 'Archived' : 'Active');
      field(dl, 'session ID', session.id);
      info.append(el('h2', session.title), dl);
      const actions = el('div', undefined, 'actions');
      const archive = el('button', session.archived ? 'Unarchive' : 'Archive');
      const remove = el('button', 'Delete', 'danger');
      archive.onclick = () => mutate(session, session.archived ? 'unarchive' : 'archive', archive);
      remove.onclick = () => removeSession(session, remove);
      actions.append(archive, remove);
      row.append(info, actions);
      card.append(row);
      list.append(card);
    }
    status.textContent = `${shown.length} of ${sessions.length} sessions`;
  }
  async function request(url, options) {
    const response = await fetch(url, options);
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    return body;
  }
  async function load() {
    try {
      sessions = await request('/api/sessions');
      render();
    } catch (error) {
      status.textContent = `Error: ${error.message}`;
    }
  }
  async function mutate(session, operation, button) {
    button.disabled = true;
    try {
      await request(`/api/sessions/${encodeURIComponent(session.id)}/${operation}`, {method: 'POST'});
      await load();
    } catch (error) {
      status.textContent = `Error: ${error.message}`;
      button.disabled = false;
    }
  }
  async function removeSession(session, button) {
    if (!confirm(`Permanently delete “${session.title}” (${session.id})? This cannot be undone.`)) return;
    button.disabled = true;
    try {
      await request(`/api/sessions/${encodeURIComponent(session.id)}`, {method: 'DELETE'});
      await load();
    } catch (error) {
      status.textContent = `Error: ${error.message}`;
      button.disabled = false;
    }
  }
  filter.addEventListener('input', render);
  load();
</script>
</body>
</html>
