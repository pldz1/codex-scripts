<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Sessions</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #101214; color: #eef1f4; }
    main { max-width: 1080px; margin: 0 auto; padding: 32px 20px 60px; }
    header { display: flex; gap: 20px; align-items: end; justify-content: space-between; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 28px; }
    .muted { color: #9da7b1; }
    input[type="search"] { width: min(360px, 80vw); padding: 10px 12px; border: 1px solid #3a4148; border-radius: 8px; background: #181c20; color: inherit; }
    #status { min-height: 24px; margin: 18px 0 8px; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 14px; }
    .toolbar .spacer { flex: 1; }
    .grid { display: grid; gap: 12px; }
    article { border: 1px solid #30363d; border-radius: 10px; padding: 16px; background: #171a1e; }
    article.selected { border-color: #718096; background: #1b2025; }
    .row { display: flex; gap: 12px; justify-content: space-between; align-items: start; flex-wrap: wrap; }
    .session-info { display: flex; gap: 12px; min-width: 0; }
    .session-info > div { min-width: 0; }
    .session-check { width: 18px; height: 18px; margin-top: 2px; padding: 0; accent-color: #7c9cc4; }
    h2 { max-width: min(560px, 58vw); margin: 0 0 10px; overflow: hidden; font-size: 17px; text-overflow: ellipsis; white-space: nowrap; }
    dl { display: grid; grid-template-columns: 88px 1fr; gap: 5px 10px; margin: 0; font-size: 14px; }
    dt { color: #9da7b1; }
    dd { margin: 0; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid #4a535c; border-radius: 7px; padding: 7px 11px; background: #242a30; color: inherit; cursor: pointer; }
    button:hover { background: #303841; }
    button.danger { border-color: #8d4040; color: #ffb5b5; }
    button:disabled { opacity: .55; cursor: unset; }
    .loading-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: rgb(8 10 12 / 72%); backdrop-filter: blur(2px); }
    .loading-overlay[hidden] { display: none; }
    .loading-panel { display: flex; gap: 12px; align-items: center; padding: 18px 22px; border: 1px solid #414a53; border-radius: 10px; background: #171a1e; box-shadow: 0 14px 40px rgb(0 0 0 / 45%); }
    .spinner { width: 20px; height: 20px; border: 3px solid #4a535c; border-top-color: #eef1f4; border-radius: 50%; animation: spin .75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.5s; } }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>Codex Sessions</h1><div class="muted">Local session manager</div></div>
    <input id="filter" type="search" placeholder="Filter title, cwd, state, or ID" autocomplete="off">
  </header>
  <div id="status" class="muted">Loading…</div>
  <div class="toolbar">
    <button id="select-shown">Select shown</button>
    <button id="clear-selection">Clear</button>
    <span id="selection-status" class="muted">0 selected</span>
    <span class="spacer"></span>
    <button id="delete-selected" class="danger" disabled>Delete selected</button>
  </div>
  <section id="sessions" class="grid" aria-live="polite"></section>
</main>
<div id="delete-loading" class="loading-overlay" role="status" aria-live="assertive" hidden>
  <div class="loading-panel">
    <span class="spinner" aria-hidden="true"></span>
    <span>Deleting session(s)…</span>
  </div>
</div>
<script>
  const app = document.querySelector('main');
  const list = document.querySelector('#sessions');
  const status = document.querySelector('#status');
  const filter = document.querySelector('#filter');
  const selectShown = document.querySelector('#select-shown');
  const clearSelection = document.querySelector('#clear-selection');
  const selectionStatus = document.querySelector('#selection-status');
  const deleteSelected = document.querySelector('#delete-selected');
  const deleteLoading = document.querySelector('#delete-loading');
  let sessions = [];
  let deleteInProgress = false;
  const selected = new Set();

  function el(name, text, className) {
    const node = document.createElement(name);
    if (text !== undefined) node.textContent = text;
    if (className) node.className = className;
    return node;
  }
  function formatTime(value) {
    const date = new Date(value);
    return Number.isNaN(date.valueOf()) ? value : date.toLocaleString();
  }
  function field(dl, name, value) {
    dl.append(el('dt', name), el('dd', value || '—'));
  }
  function filteredSessions() {
    const query = filter.value.trim().toLowerCase();
    return sessions.filter(session => [
      session.title, session.cwd, session.id, session.archived ? 'archived' : 'active'
    ].join(' ').toLowerCase().includes(query));
  }
  function setDeleteLoading(active) {
    deleteInProgress = active;
    deleteLoading.hidden = !active;
    app.inert = active;
    app.setAttribute('aria-busy', String(active));
  }
  function render() {
    const shown = filteredSessions();
    list.replaceChildren();
    for (const session of shown) {
      const card = el('article');
      if (selected.has(session.id)) card.classList.add('selected');
      const row = el('div', undefined, 'row');
      const info = el('div', undefined, 'session-info');
      const check = el('input', undefined, 'session-check');
      check.type = 'checkbox';
      check.checked = selected.has(session.id);
      check.setAttribute('aria-label', `Select ${session.title}`);
      check.onchange = () => {
        if (check.checked) selected.add(session.id);
        else selected.delete(session.id);
        render();
      };
      const details = el('div');
      const dl = el('dl');
      field(dl, 'cwd', session.cwd);
      field(dl, 'updated', formatTime(session.updated_at));
      field(dl, 'state', session.archived ? 'Archived' : 'Active');
      field(dl, 'session ID', session.id);
      const title = el('h2', session.title);
      title.title = session.title;
      details.append(title, dl);
      info.append(check, details);
      const actions = el('div', undefined, 'actions');
      const archive = el('button', session.archived ? 'Unarchive' : 'Archive');
      const remove = el('button', 'Delete', 'danger');
      archive.onclick = () => mutate(session, session.archived ? 'unarchive' : 'archive', archive);
      remove.onclick = () => removeSession(session, remove);
      actions.append(archive, remove);
      row.append(info, actions);
      card.append(row);
      list.append(card);
    }
    status.textContent = `${shown.length} of ${sessions.length} sessions`;
    selectionStatus.textContent = `${selected.size} selected`;
    const allShownSelected = shown.length > 0 && shown.every(session => selected.has(session.id));
    selectShown.textContent = allShownSelected ? 'Unselect shown' : 'Select shown';
    selectShown.disabled = shown.length === 0;
    deleteSelected.disabled = selected.size === 0;
    clearSelection.disabled = selected.size === 0;
  }
  async function request(url, options) {
    const response = await fetch(url, options);
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    return body;
  }
  async function load() {
    try {
      sessions = await request('/api/sessions');
      const available = new Set(sessions.map(session => session.id));
      for (const id of selected) if (!available.has(id)) selected.delete(id);
      render();
    } catch (error) {
      status.textContent = `Error: ${error.message}`;
    }
  }
  async function mutate(session, operation, button) {
    button.disabled = true;
    try {
      await request(`/api/sessions/${encodeURIComponent(session.id)}/${operation}`, {method: 'POST'});
      await load();
    } catch (error) {
      status.textContent = `Error: ${error.message}`;
      button.disabled = false;
    }
  }
  async function removeSession(session, button) {
    if (deleteInProgress) return;
    if (!confirm(`Permanently delete “${session.title}” (${session.id})? This cannot be undone.`)) return;
    button.disabled = true;
    setDeleteLoading(true);
    try {
      await request(`/api/sessions/${encodeURIComponent(session.id)}`, {method: 'DELETE'});
      await load();
    } catch (error) {
      status.textContent = `Error: ${error.message}`;
    } finally {
      button.disabled = false;
      setDeleteLoading(false);
    }
  }
  selectShown.onclick = () => {
    const shown = filteredSessions();
    const allShownSelected = shown.length > 0 && shown.every(session => selected.has(session.id));
    for (const session of shown) {
      if (allShownSelected) selected.delete(session.id);
      else selected.add(session.id);
    }
    render();
  };
  clearSelection.onclick = () => {
    selected.clear();
    render();
  };
  deleteSelected.onclick = async () => {
    if (deleteInProgress) return;
    const ids = [...selected];
    if (!confirm(`Permanently delete ${ids.length} selected session(s)? This cannot be undone.`)) return;
    deleteSelected.disabled = true;
    setDeleteLoading(true);
    try {
      const result = await request('/api/sessions/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ids})
      });
      for (const id of result.deleted) selected.delete(id);
      await load();
      if (result.failed.length) {
        status.textContent = `Deleted ${result.deleted.length}; failed ${result.failed.length}: ` +
          result.failed.map(item => `${item.id}: ${item.error}`).join('; ');
      }
    } catch (error) {
      status.textContent = `Error: ${error.message}`;
    } finally {
      deleteSelected.disabled = selected.size === 0;
      setDeleteLoading(false);
    }
  };
  filter.addEventListener('input', render);
  load();
</script>
</body>
</html>
